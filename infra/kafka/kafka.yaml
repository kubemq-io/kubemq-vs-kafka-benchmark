# JMX Prometheus exporter config (added for the showcase, docs/METHOD.md): only the four
# metric families the report reads — request-handler and network-processor idle ratio, GC, and
# log segment rolls/flushes. Nothing here changes broker behaviour.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: kafka
  labels:
    app: strimzi
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>OneMinuteRate
        name: kafka_server_request_handler_avg_idle_percent
        type: GAUGE
      - pattern: kafka.network<type=SocketServer, name=NetworkProcessorAvgIdlePercent><>Value
        name: kafka_network_processor_avg_idle_percent
        type: GAUGE
      - pattern: kafka.network<type=RequestMetrics, name=(TotalTimeMs|LocalTimeMs|RemoteTimeMs|ResponseQueueTimeMs|RequestQueueTimeMs), request=(Produce|FetchConsumer|FetchFollower)><>(99thPercentile|Mean)
        name: kafka_network_request_$1_ms
        type: GAUGE
        labels: {request: "$2", quantile: "$3"}
      - pattern: kafka.log<type=LogFlushStats, name=LogFlushRateAndTimeMs><>(Count|99thPercentile)
        name: kafka_log_flush_$1
        type: GAUGE
      - pattern: kafka.log<type=Log, name=LogEndOffset, topic=(.+), partition=(.+)><>Value
        name: kafka_log_end_offset
        type: GAUGE
        labels: {topic: "$1", partition: "$2"}
      - pattern: kafka.server<type=ReplicaManager, name=(UnderReplicatedPartitions|IsrShrinksPerSec|IsrExpandsPerSec)><>(Value|Count)
        name: kafka_server_replica_manager_$1
        type: GAUGE
      - pattern: java.lang<type=GarbageCollector, name=(.+)><>(CollectionCount|CollectionTime)
        name: jvm_gc_$2
        type: COUNTER
        labels: {gc: "$1"}
      - pattern: java.lang<type=Memory><HeapMemoryUsage>(used|committed)
        name: jvm_memory_heap_$1_bytes
        type: GAUGE
---
# Apache Kafka 4.3.1, KRaft combined broker+controller, 3 nodes, one per broker node.
# Combined mode is not Strimzi's production recommendation; it is chosen for symmetry
# with KubeMQ's in-process Raft (docs/METHOD.md).
#
# Broker tuning (docs/METHOD.md) is under spec.kafka.config, inline, one comment per
# knob. Chosen by the 2026-09-29 tuning session (tuning/kafka.md): the last step whose two T1
# runs both beat every earlier run.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: kafka
  labels:
    strimzi.io/cluster: bench
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        class: local-ssd
        size: 600Gi
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests: {cpu: "7", memory: 26Gi}
    limits: {cpu: "7", memory: 26Gi}
  jvmOptions:
    "-Xms": 6g
    "-Xmx": 6g
  template:
    pod:
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kkbench/pool, operator: In, values: [broker]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/cluster: bench
                  strimzi.io/broker-role: "true"
              topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: bench
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    image: quay.io/strimzi/kafka@sha256:e90a1a74af4226f3ca4d1ebef3ab13bdb09754ae17ca4c1444f7fcbb0ca8ea9a
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      # --- tuning session 2026-09-29 (tuning/kafka.md) ---
      num.network.threads: 8            # default 3
      num.io.threads: 16                # default 8
      num.replica.fetchers: 4           # default 1
      replica.fetch.max.bytes: 10485760 # default 1 MiB
      socket.send.buffer.bytes: 1048576     # default 100 KiB
      socket.receive.buffer.bytes: 1048576  # default 100 KiB
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  # No topic or user operator: OMB creates and deletes its own topics through the admin
  # API, exactly as it does against KubeMQ.
