# Publishes report/ (the generated results page and its assets) to GitHub Pages.
# One-time setup in the repository settings: Pages → Source → "GitHub Actions".
name: Publish results page
on:
  push:
    branches: [main]
    paths: [report/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: report
      - id: deployment
        uses: actions/deploy-pages@v4
